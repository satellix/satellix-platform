name: Build and test Quarkus microservices

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - satellite-tracking-and-prediction-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            services/${{ matrix.service }}/pom.xml
            services/${{ matrix.service }}/**/pom.xml

      - name: Build and test
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify -DskipITs=false
